<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Détecteur de mouvement</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px;
    }

    video {
      width: 90%;
      max-width: 600px;
      border-radius: 15px;
    }

    #statut {
      margin: 20px;
      font-size: 25px;
      font-weight: bold;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>📷 Détecteur de mouvement</h1>

  <video id="camera" autoplay playsinline></video>

  <div id="statut">Caméra arrêtée</div>

  <button onclick="demarrerCamera()">
    Démarrer la caméra
  </button>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>

    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statut = document.getElementById("statut");

    let ancienneImage = null;

    async function demarrerCamera() {

      try {

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          },
          audio: false
        });

        video.srcObject = stream;

        statut.textContent = "🟢 Caméra active";

        video.addEventListener("playing", () => {

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          setInterval(detecterMouvement, 300);

        });

      } catch (erreur) {

        console.error(erreur);

        statut.textContent =
          "❌ Impossible d'utiliser la caméra";

      }
    }


    function detecterMouvement() {

      if (video.videoWidth === 0) return;

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const imageActuelle = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

      if (!ancienneImage) {

        ancienneImage = imageActuelle;
        return;

      }

      let changements = 0;

      // On analyse seulement 1 pixel sur 20
      for (
        let i = 0;
        i < imageActuelle.data.length;
        i += 80
      ) {

        const r1 = imageActuelle.data[i];
        const g1 = imageActuelle.data[i + 1];
        const b1 = imageActuelle.data[i + 2];

        const r2 = ancienneImage.data[i];
        const g2 = ancienneImage.data[i + 1];
        const b2 = ancienneImage.data[i + 2];

        const difference =
          Math.abs(r1 - r2) +
          Math.abs(g1 - g2) +
          Math.abs(b1 - b2);

        if (difference > 60) {
          changements++;
        }
      }

      if (changements > 100) {

        statut.textContent =
          "🚨 MOUVEMENT DÉTECTÉ !";

      } else {

        statut.textContent =
          "🟢 Aucun mouvement";

      }

      ancienneImage = imageActuelle;
    }

  </script>

</body>
</html>
